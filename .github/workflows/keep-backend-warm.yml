name: Keep backends warm

# Render's free web services stop after ~15 minutes idle, and the next request
# pays the cold start. Measured against all three of our backends: 22-32
# seconds. That is long enough for a first-time visitor to assume the site is
# broken, and it used to be long enough to silently lose an Admin -> Teacher
# course assignment (the bridge gave up at 8s).
#
# WHAT THIS WORKFLOW CAN AND CANNOT DO
#
# It reduces how often a real user meets a cold start. It does NOT guarantee a
# warm backend, and nothing in the application may depend on it for
# correctness. The schedule below asks for a ping every 10 minutes; GitHub
# actually delivered 7 runs in 32 hours, with gaps up to 8.6 hours. Scheduled
# workflows are explicitly best-effort and are dropped under load, so a service
# that sleeps after 15 minutes is asleep most of the time regardless of what
# this file requests.
#
# The reliability fix therefore lives in the code: admin/backend's teacher
# bridge retries with a cold-start-sized budget (see
# services/teacherBridge.service.js). This workflow is an optimisation on top
# of that, not the mechanism anything relies on.
#
# For genuinely reliable warming, point an external uptime pinger
# (cron-job.org, UptimeRobot, Better Stack - all have free tiers that really do
# fire every 5 minutes) at the three health URLs below, or move off Render's
# free tier. Both are operator decisions, deliberately not made here.
#
# The schedule is UTC and covers roughly 06:00-01:00 IST, deliberately stopping
# overnight rather than burning free instance hours for nobody.

on:
  schedule:
    - cron: '*/10 0-19 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Every backend is pinged even if an earlier one is down - warming the
      # teacher portal matters most precisely when something else is unhealthy.
      fail-fast: false
      matrix:
        include:
          - name: student
            url: https://nalandanexus.onrender.com
          - name: teacher
            url: https://nalandanexus-1-bj7j.onrender.com
          - name: admin
            url: https://nalandanexus-1.onrender.com

    name: Ping ${{ matrix.name }} backend
    steps:
      - name: Ping /api/health
        run: |
          # --max-time is generous on purpose: if the service IS asleep, this
          # request is the one paying the cold start, which is the whole point.
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 120 \
            "${{ matrix.url }}/api/health") || true

          echo "[${{ matrix.name }}] HTTP $code"
          cat /tmp/health.json || true
          echo

          if [ "$code" != "200" ]; then
            echo "::warning::${{ matrix.name }} health check returned $code"
            exit 0   # a transient failure must not spam the Actions log with red runs
          fi

          # A 200 with a disconnected database still means the portal is broken
          # for every user, so surface that distinctly. All three backends
          # report this field, though the rest of their health shape differs.
          if ! grep -q '"database":"connected"' /tmp/health.json; then
            echo "::error::${{ matrix.name }} backend is up but its database is NOT connected"
            exit 1
          fi

          echo "[${{ matrix.name }}] healthy and warm."
